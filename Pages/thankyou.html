<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@googlemaps/js-api-loader@1.16.2/dist/index.min.js"></script>

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
            padding: 30px;
        }

        #map {
            height: 300px;
            width: 100%;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <div class="card shadow-lg">
        <h2 class="text-center mb-3">Appointment Confirmed</h2>
        <p><strong>Clinic:</strong> <span id="clinicLocation">Loading...</span></p>
        <p><strong>Date:</strong> <span id="appointmentDate">Loading...</span></p>
        <p><strong>Time:</strong> <span id="appointmentTime">Loading...</span></p>
        <p class="text-danger"><strong>Note:</strong> Please arrive 10 minutes early.</p>
        <a href="appointments.html" class="btn btn-primary">Back to Appointments</a>
    </div>

    <div id="map"></div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const clinic = localStorage.getItem("appointmentClinic");
            const date = localStorage.getItem("appointmentDate");
            const time = localStorage.getItem("appointmentTime");

            if (!clinic || !date || !time) {
                alert("Missing appointment details. Redirecting...");
                window.location.href = "appointments.html";
            }

            document.getElementById("clinicLocation").textContent = clinic;
            document.getElementById("appointmentDate").textContent = date;
            document.getElementById("appointmentTime").textContent = time;

            const clinicCoordinates = {
                "Universal Dental Care-Kitchener": { lat: 43.4233, lng: -80.4720 },
                "Universal Dental Care-Waterloo": { lat: 43.4668, lng: -80.5228 },
                "Universal Dental Care-Cambridge": { lat: 43.3795, lng: -80.3137 }
            };

            const coords = clinicCoordinates[clinic];
            if (!coords) {
                document.getElementById("map").textContent = "Map location not available.";
                return;
            }

            const loader = new google.maps.plugins.loader.Loader({
                apiKey: "AIzaSyAZacZgOg8a9AeS8zdAle87_P1sCwcrufY",
                version: "weekly"
            });

            try {
                await loader.load();

                const map = new google.maps.Map(document.getElementById("map"), {
                    center: coords,
                    zoom: 15,
                });

                new google.maps.Marker({
                    position: coords,
                    map: map,
                    title: clinic
                });

                // Clear localStorage
                localStorage.removeItem("appointmentClinic");
                localStorage.removeItem("appointmentDate");
                localStorage.removeItem("appointmentTime");
            } catch (e) {
                console.error("Google Maps failed to load:", e);
                document.getElementById("map").textContent = "Failed to load map.";
            }
        });
    </script>
</body>

</html>
