<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Appointments</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <style>
    body {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .container {
      width: 100%;
      max-width: 500px;
    }
    .card {
      width: 100%;
    }
  </style>
  <body>
    <div class="container">
      <h2 class="text-center mb-3">My Upcoming Appointments</h2>
      <div id="appointmentsList" class="mb-3"></div>
      <a href="appointments.html" class="btn btn-secondary w-100"
        >Back to Appointments</a
      >
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const appointmentsList = document.getElementById("appointmentsList");

        const token = localStorage.getItem("token");
        if (!token) {
          alert("You must be logged in to view appointments.");
          window.location.href = "index.html";
          return;
        }

        try {
          const response = await fetch(
            "http://localhost:5000/api/appointments/my-appointments",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
            }
          );

          if (!response.ok) {
            throw new Error("Failed to fetch appointments.");
          }

          const appointments = await response.json();

          if (appointments.length === 0) {
            appointmentsList.innerHTML = `<p class="text-center text-muted">No upcoming appointments found.</p>`;
            return;
          }

          appointmentsList.innerHTML = appointments
            .map((appt) => {
              return `
                <div class="card p-3 mb-2 shadow-sm" data-id="${appt._id}">
                  <p><strong>Patient:</strong> ${appt.name || "N/A"}</p>
                  <p><strong>Date:</strong> ${appt.date}</p>
                  <p><strong>Time:</strong> ${appt.slot}</p>
                  <p><strong>Reason:</strong> ${appt.reason || "N/A"}</p>

               <div class="d-flex justify-content-end gap-2 mt-3">
    <button 
      class="btn btn-outline-primary btn-sm rounded-pill d-flex align-items-center gap-1 edit-btn"
      data-id="${appt._id}" 
      title="Edit Appointment">
      ✏️ <span>Edit</span>
    </button>

    <button 
      class="btn btn-outline-danger btn-sm rounded-pill d-flex align-items-center gap-1"
      onclick="deleteAppointment('${appt._id}')"
      title="Delete Appointment">
      🗑️ <span>Cancel</span>
    </button>
  </div>
                </div>
              `;
            })
            .join("");
        } catch (err) {
          appointmentsList.innerHTML = `<p class="text-center text-danger">${err.message}</p>`;
        }
      });



      document.addEventListener("click", (e) => {
  if (e.target.closest(".edit-btn")) {
    const button = e.target.closest(".edit-btn");
    const appointmentId = button.getAttribute("data-id");
    window.location.href = `edit-appointment.html?id=${appointmentId}`;
  }
});

      function deleteAppointment(appointmentId){
        if (confirm("Are you sure you want to delete this appointment?")) {
          const token = localStorage.getItem("token");
          fetch(`http://localhost:5000/api/appointments/${appointmentId}`,{
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            }
          })
                  .then(response =>{
                    if (response.ok){
                      alert("Appointment deleted successfully!");
                      document.querySelector(`[data-id="${appointmentId}"]`).remove();
                    } else {
                      return response.json().then(data => {
                        throw new Error(data.message || "Failed to delete appointment.");
                      });
                    }
                  })
                  .catch(error =>{
                    alert("Error: "+ error.message);
                  });
        }
      }

    </script>
  </body>
</html>
