<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentalCare Booking</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(to right, #56ccf2, #2f80ed);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        font-family: "Segoe UI", sans-serif;
      }

      .welcome-card {
        background: #fff;
        border-radius: 20px;
        padding: 40px 30px;
        max-width: 600px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        width: 200px;
        height: auto;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 2.5rem;
        color: #007bff;
        margin-bottom: 10px;
      }

      p {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 30px;
      }

      .btn-custom {
        font-size: 1.1rem;
        padding: 12px 30px;
        border-radius: 10px;
        width: 100%;
        margin-bottom: 15px;
        transition: background 0.3s ease;
      }

      .btn-custom:hover {
        background: #0056b3;
        color: #fff;
      }

      @media (min-width: 576px) {
        .btn-group-custom {
          display: flex;
          gap: 20px;
          justify-content: center;
        }

        .btn-custom {
          width: 200px;
        }
      }
      #chatbot {
          position: fixed;
          bottom: 20px;
          right: 20px;
          width: 300px;
          background: #ffffff;
          border-radius: 12px;
          border: 1px solid #ddd;
          border-top: none; 
          padding: 12px;
          font-family: 'Segoe UI', sans-serif;
          font-size: 12px; 
          z-index: 1000;
      }

      #chat-log {
          max-height: 240px;
          overflow-y: auto;
          font-size: 10px;
          margin-bottom: 10px;
          border-radius: 8px;
          background: #f9f9f9;
      }

      #chat-log div {
          margin: 6px 0;
      }

      #chat-log .user {
          color: #333;
      }

      #chat-log .bot {
          color: #007bff;
      }

      #chat-input {
          flex: 1;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 6px;
          outline: none;
          width: 70%;
      }

      #chatbot button {
          background-color: #4CAF50;
          color: white;
          border: none;
          padding: 8px 12px;
          border-radius: 6px;
          cursor: pointer;
          width: 25%;
          transition: background 0.3s;
      }

      #chatbot button:hover {
          background-color: #45a049;
      }

      #chatbot-input-area {
          display: flex;
          gap: 6px;
      }
    </style>
  </head>
  <body>
    <div class="welcome-card">
      <img src="../assets/logo.PNG" alt="DentalCare Logo" class="logo" />

      <h1>Welcome to DentalCare</h1>
      <p>Book your dental appointments quickly, securely, and stress-free.</p>

      <div class="btn-group-custom">
        <a href="login.html" class="btn btn-primary btn-custom">Login</a>
        <a href="signup.html" class="btn btn-outline-primary btn-custom"
          >Sign Up</a
        >
      </div>
      <div id="chatbot">
        <div id="chat-log"></div>
        <div id="chatbot-input-area">
          <input type="text" id="chat-input" placeholder="How can I help you?" />
          <button onclick="handleChat()">Send</button> 
        </div>
      </div>

    </div>
    <script src="//code.tidio.co/your-widget-id.js" async></script>
    <script src="../js/script.js"></script>
  </body>
</html>
